app-id: com.cheney.happy-friday
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: happy-friday
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
  env:
    CARGO_HOME: /run/build/happy-friday/cargo
    npm_config_nodedir: /usr/lib/sdk/node22
  build-args:
    - --share=network

modules:
  - name: happy-friday
    buildsystem: simple
    build-commands:
      - NPM_CONFIG_PREFIX=/app npm install -g pnpm@9
      - pnpm install --frozen-lockfile
      - pnpm build
      - cd src-tauri && cargo build --release
      - install -Dm755 src-tauri/target/release/happy-friday ${FLATPAK_DEST}/bin/happy-friday
      - install -Dm644 com.cheney.happy-friday.desktop ${FLATPAK_DEST}/share/applications/com.cheney.happy-friday.desktop
      - install -Dm644 src-tauri/icons/32x32.png ${FLATPAK_DEST}/share/icons/hicolor/32x32/apps/com.cheney.happy-friday.png
      - install -Dm644 src-tauri/icons/128x128.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/com.cheney.happy-friday.png
      - install -Dm644 src-tauri/icons/128x128@2x.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/com.cheney.happy-friday.png
      - install -Dm644 src-tauri/icons/icon.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/com.cheney.happy-friday.png
      - install -Dm644 com.cheney.happy-friday.metainfo.xml ${FLATPAK_DEST}/share/metainfo/com.cheney.happy-friday.metainfo.xml
    sources:
      - type: dir
        path: .
