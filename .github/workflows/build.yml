name: Build Tauri App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            arch: x86_64
            target: x86_64-pc-windows-msvc
            ext: .exe

          - platform: windows-latest
            arch: aarch64
            target: aarch64-pc-windows-msvc
            ext: .exe

          - platform: ubuntu-22.04
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            ext: ""

          - platform: ubuntu-22.04
            arch: aarch64
            target: aarch64-unknown-linux-gnu
            ext: ""

          - platform: macos-13
            arch: x86_64
            target: x86_64-apple-darwin
            ext: ""
            signing_key: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}

          - platform: macos-14
            arch: aarch64
            target: aarch64-apple-darwin
            ext: ""
            signing_key: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}

          - platform: macos-14
            arch: universal
            target: universal-apple-darwin
            ext: ""
            signing_key: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04' && matrix.arch == 'aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install

      - name: Setup Apple code signing
        if: matrix.platform == 'macos-*' && matrix.signing_key != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ matrix.signing_key }}
          APPLE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_APP: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'happy-friday v__VERSION__'
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --no-bundle

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: happy-friday-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/
            !src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dSYM/**

  create-universal-macos:
    needs: build-tauri
    runs-on: macos-14
    if: success()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: happy-friday-macos-13-x86_64
          path: artifacts/x86_64

      - name: Download aarch64 artifact
        uses: actions/download-artifact@v4
        with:
          name: happy-friday-macos-14-aarch64
          path: artifacts/aarch64

      - name: Create Universal binary (optional)
        run: |
          echo "Universal binaries are built via Tauri's native universal target"
          ls -la artifacts/

      - name: Upload combined macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: happy-friday-macos-all
          path: artifacts/
